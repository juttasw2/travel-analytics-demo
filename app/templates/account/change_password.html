{% extends "base.html" %}

{% block title %}Wachtwoord wijzigen · TravelAnalytics{% endblock %}

{% block content %}
<div class="container-fluid px-0">

  <div class="mb-4">
    <h1 class="page-title">Wachtwoord wijzigen</h1>
    <p class="page-subtitle">Werk het wachtwoord van je eigen account bij.</p>
  </div>

  <div class="row">
    <div class="col-12 col-lg-6 col-xl-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

          {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
          {% endif %}

          <form method="post" id="change-password-form" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

            <div class="mb-3">
              <label for="current_password" class="form-label">Huidig wachtwoord</label>
              <input
                id="current_password"
                name="current_password"
                type="password"
                class="form-control"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="mb-3">
              <label for="new_password" class="form-label">Nieuw wachtwoord</label>
              <input
                id="new_password"
                name="new_password"
                type="password"
                class="form-control"
                autocomplete="new-password"
                required
                minlength="8"
              />
              <div class="form-text">Minimaal 8 tekens.</div>
            </div>

            <div class="mb-4">
              <label for="new_password_confirm" class="form-label">Bevestig nieuw wachtwoord</label>
              <input
                id="new_password_confirm"
                name="new_password_confirm"
                type="password"
                class="form-control"
                autocomplete="new-password"
                required
                minlength="8"
              />
            </div>

            <div class="d-flex gap-2">
              <button type="submit" id="submit-btn" class="btn btn-primary">Wachtwoord opslaan</button>
              <a href="{{ url_for('dashboard.account_manage') }}" class="btn btn-outline-secondary">Annuleren</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  (function () {
    var form = document.getElementById("change-password-form");
    var submitBtn = document.getElementById("submit-btn");
    if (!form || !submitBtn) return;
    form.addEventListener("submit", function () {
      submitBtn.disabled = true;
      submitBtn.textContent = "Bezig met opslaan…";
    });
  })();
</script>
{% endblock %}
