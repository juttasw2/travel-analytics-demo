<div class="modal fade" id="excManageModal" tabindex="-1" aria-labelledby="excManageModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content border-0 shadow">
      <div class="modal-header">
        <h5 class="modal-title" id="excManageModalLabel">Inkoopprijs toevoegen</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Sluiten"></button>
      </div>
      <div class="modal-body">
        <div id="excManageFormError" class="alert alert-danger d-none mb-3" role="alert"></div>
        <form id="excUpdateForm" class="row g-3" novalidate>
          <div class="col-12">
            <label class="form-label" for="excUpdateExisting">Bestaande excursie</label>
            <select id="excUpdateExisting" class="form-select" required></select>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label" for="excUpdateSellPrice">Verkoopprijs</label>
            <input id="excUpdateSellPrice" class="form-control" type="number" min="0" step="0.01" required />
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label" for="excUpdateCommission">Commissie (bedrag)</label>
            <input id="excUpdateCommission" class="form-control" type="number" min="0" step="0.01" />
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label" for="excUpdateCommissionPct">Commissie (%)</label>
            <input id="excUpdateCommissionPct" class="form-control" type="number" min="0" max="100" step="0.01" />
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label" for="excUpdateYear">Kostjaar</label>
            <input id="excUpdateYear" class="form-control" type="number" min="2000" max="2100" step="1" />
          </div>
          <div class="col-12">
            <label class="form-label" for="excUpdateBuyPrice">Inkoopprijs (automatisch)</label>
            <input id="excUpdateBuyPrice" class="form-control" type="number" min="0" step="0.01" readonly />
          </div>
          <div class="col-12">
            <p class="text-muted small mb-0">
              Commissie invullen als bedrag of percentage. Inkoopprijs wordt automatisch berekend via
              <code>verkoopprijs - commissie</code> en opgeslagen in de jaarkost van het gekozen jaar.
            </p>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-overzicht-secondary" data-bs-dismiss="modal">Annuleren</button>
        <button type="button" class="btn btn-overzicht-apply" id="excManageSubmitBtn">Opslaan</button>
      </div>
    </div>
  </div>
</div>
