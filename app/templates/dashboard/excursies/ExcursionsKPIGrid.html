{# ExcursionsKPIGrid — CSS grid: 5 gelijke kolommen op lg+, responsive daaronder #}
<div class="excursion-kpi-section mb-4" id="excursionsKpiRoot">
  <div class="excursion-kpi-grid">
    <div class="card border-0 shadow-sm h-100 excursion-kpi-card">
      <div class="card-body excursion-kpi-card__body d-flex flex-column p-3">
        <div class="excursion-kpi-label">% pax met excursies</div>
        <div class="excursion-kpi-value mt-auto" id="excKpiPaxPct">—</div>
        <div class="excursion-kpi-compare small mt-1" id="excKpiPaxPctCmp"></div>
      </div>
    </div>
    <div class="card border-0 shadow-sm h-100 excursion-kpi-card">
      <div class="card-body excursion-kpi-card__body d-flex flex-column p-3">
        <div class="excursion-kpi-label">Totale excursie omzet</div>
        <div class="excursion-kpi-value mt-auto" id="excKpiOmzet">—</div>
        <div class="excursion-kpi-compare small mt-1" id="excKpiOmzetCmp"></div>
      </div>
    </div>
    <div class="card border-0 shadow-sm h-100 excursion-kpi-card">
      <div class="card-body excursion-kpi-card__body d-flex flex-column p-3">
        <div class="excursion-kpi-label">Winst excursies</div>
        <div class="excursion-kpi-value mt-auto" id="excKpiWinst">—</div>
        <div class="excursion-kpi-compare small mt-1" id="excKpiWinstCmp"></div>
      </div>
    </div>
    <div class="card border-0 shadow-sm h-100 excursion-kpi-card">
      <div class="card-body excursion-kpi-card__body d-flex flex-column p-3">
        <div class="excursion-kpi-label">Aantal excursieboekingen</div>
        <div class="excursion-kpi-value mt-auto" id="excKpiLines">—</div>
        <div class="excursion-kpi-compare small mt-1" id="excKpiLinesCmp"></div>
      </div>
    </div>
    <div class="card border-0 shadow-sm h-100 excursion-kpi-card">
      <div class="card-body excursion-kpi-card__body excursion-kpi-card__body--landshare d-flex flex-column p-3">
        <div class="excursion-kpi-label">Aandeel excursies BE / NL</div>
        <div class="excursion-kpi-value excursion-kpi-value--split" id="excKpiLandShare">—</div>
        <div class="excursion-kpi-compare small mt-1" id="excKpiLandShareCmp"></div>
      </div>
    </div>
  </div>
</div>
